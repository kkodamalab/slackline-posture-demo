<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Slackline Posture Demo (Tasks API)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  #videoArea {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    background: #000;
  }
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* ミラー表示 */
  }
  #info {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 12px 16px;
    font-size: 16px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 8px;
    line-height: 1.4;
    white-space: pre-line;
    max-width: 80vw;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="videoArea">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>
<div id="info">Loading…</div>

<script type="module">
import {FilesetResolver, PoseLandmarker}
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

const video  = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx    = canvas.getContext("2d");
const info   = document.getElementById("info");

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: "user",
      width:  { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  });
  video.srcObject = stream;
  return new Promise(resolve => {
    video.onloadedmetadata = () => resolve();
  });
}

function avg(a, b) {
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

async function main() {
  try {
    await setupCamera();

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
    );

    const poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task"
      },
      runningMode: "VIDEO",
      numPoses: 1
    });

    info.textContent = "Pose loaded. Step back.";

    let lastVideoTime = -1;

    function renderLoop() {
      if (video.readyState < 2) {
        requestAnimationFrame(renderLoop);
        return;
      }

      if (canvas.width !== video.videoWidth ||
          canvas.height !== video.videoHeight) {
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      if (video.currentTime === lastVideoTime) {
        requestAnimationFrame(renderLoop);
        return;
      }
      lastVideoTime = video.currentTime;

      const nowMs = performance.now();
      const result = poseLandmarker.detectForVideo(video, nowMs);

      // 背景描画（ミラー）
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      ctx.restore();

      // 理想姿勢（中央の垂直線）
      const midX = canvas.width / 2;
      ctx.strokeStyle = "yellow";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(midX, 0);
      ctx.lineTo(midX, canvas.height);
      ctx.stroke();

      if (!result.landmarks?.length) {
        info.textContent = "Detecting…";
        requestAnimationFrame(renderLoop);
        return;
      }

      const lm = result.landmarks[0];

      // 肩と腰の中点
      let s = avg(lm[11], lm[12]);
      let h = avg(lm[23], lm[24]);

      // 正規化 → ピクセル
      s.x *= canvas.width;  s.y *= canvas.height;
      h.x *= canvas.width;  h.y *= canvas.height;

      // ★ ミラー補正（描画座標も反転）
      s.x = canvas.width - s.x;
      h.x = canvas.width - h.x;

      // 体幹ベクトル
      const vx = h.x - s.x;
      const vy = h.y - s.y;

      // 正規化
      const len = Math.hypot(vx, vy) || 1;
      const ux = vx / len;
      const uy = vy / len;

      // 中点
      const cx = (s.x + h.x) / 2;
      const cy = (s.y + h.y) / 2;

      // ===== 上下端との交点を計算 =====
      const tTop    = -cy / uy;
      const tBottom = (canvas.height - cy) / uy;

      const xTop    = cx + ux * tTop;
      const yTop    = 0;
      const xBottom = cx + ux * tBottom;
      const yBottom = canvas.height;

      // 体軸描画
      ctx.strokeStyle = "cyan";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(xTop, yTop);
      ctx.lineTo(xBottom, yBottom);
      ctx.stroke();

      // ===== 垂直からの傾き角 =====
      let deg = Math.acos(
        Math.max(-1, Math.min(1, -uy))
      ) * 180 / Math.PI;

      if (ux < 0) deg = -deg;

      const direction = deg > 0 ? "右" : "左";
      const deviation = Math.abs(deg).toFixed(1);

      info.textContent =
        `Pose detected.\n体軸傾き：${direction}に ${deviation}°\n理想姿勢は垂直（0°）です。\n傾きを0に近づけてください。`;

      requestAnimationFrame(renderLoop);
    }

    renderLoop();
  } catch (e) {
    console.error(e);
    info.textContent = "Error: " + e.message;
  }
}

main();
</script>
</body>
</html>
