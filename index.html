<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Slackline Posture Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  #videoArea {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
  }
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #info {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 16px;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    border-radius: 8px;
    text-align: center;
    pointer-events: none;

    width: max-content;
    max-width: 95vw;
    white-space: pre; /* 改行は効かせる・自動折返ししない */
  }
</style>
</head>
<body>

<div id="videoArea">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>
<div id="info">Loading…</div>

<script type="module">
import {FilesetResolver, PoseLandmarker}
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

const video  = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx    = canvas.getContext("2d");
const info   = document.getElementById("info");

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" },
    audio: false
  });
  video.srcObject = stream;
  return new Promise(r => video.onloadedmetadata = r);
}

const avg = (a,b) => ({ x:(a.x+b.x)/2, y:(a.y+b.y)/2 });

async function main() {
  await setupCamera();

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
  );

  const pose = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });

  let lastTime = -1;

  function loop() {
    if (video.readyState < 2) {
      requestAnimationFrame(loop);
      return;
    }

    if (canvas.width !== video.videoWidth ||
        canvas.height !== video.videoHeight) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    if (video.currentTime === lastTime) {
      requestAnimationFrame(loop);
      return;
    }
    lastTime = video.currentTime;

    const res = pose.detectForVideo(video, performance.now());

    /* 背景描画（非ミラー） */
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    /* Ideal posture */
    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();

    if (!res.landmarks?.length) {
      info.textContent = "Detecting posture…";
      requestAnimationFrame(loop);
      return;
    }

    const lm = res.landmarks[0];
    let s = avg(lm[11], lm[12]); // shoulders
    let h = avg(lm[23], lm[24]); // hips

    /* ★ ここは今まで通り（勝手に変えていない） */
    s.x = 1 - s.x;
    h.x = 1 - h.x;

    s.x *= canvas.width;  s.y *= canvas.height;
    h.x *= canvas.width;  h.y *= canvas.height;

    const vx = h.x - s.x;
    const vy = h.y - s.y;
    const len = Math.hypot(vx, vy) || 1;
    const ux = vx / len;
    const uy = vy / len;

    const cx = (s.x + h.x) / 2;
    const cy = (s.y + h.y) / 2;

    const tTop    = -cy / uy;
    const tBottom = (canvas.height - cy) / uy;

    /* Current posture */
    ctx.strokeStyle = "cyan";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx + ux * tTop, 0);
    ctx.lineTo(cx + ux * tBottom, canvas.height);
    ctx.stroke();

    let deg = Math.acos(
      Math.max(-1, Math.min(1, -uy))
    ) * 180 / Math.PI;
    if (ux > 0) deg = -deg;

    const absDeg = Math.abs(deg).toFixed(1);
    const side = deg > 0 ? "Right" : "Left";

    info.textContent =
      `Yellow line: Ideal posture
Blue line: Current posture ${absDeg}° ${side}`;

    requestAnimationFrame(loop);
  }

  loop();
}

main();
</script>
</body>
</html>
